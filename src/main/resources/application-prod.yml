#payment src/main/resources/application-prod.yml
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.example.payment.dto

kakao:
  pay:
    # 운영 환경에서는 시크릿 키를 소스코드에 하드코딩하지 않고 환경변수로 주입
    secret-key: ${KAKAO_PAY_SECRET_KEY:dev_secret_key_here} 
    cid: TC0ONETIME
    
    # 운영 환경 베이스 URL 변수 선언 (환경변수 주입 가능함~)
    client-base-url: ${APP_CLIENT_BASE_URL:http://34.64.85.123/msa/pay}
    
    # 선언한 변수를 참조하여 URL 구성
    approval-url: ${kakao.pay.client-base-url}/payment/success
    cancel-url: ${kakao.pay.client-base-url}/payment/cancel
    fail-url: ${kakao.pay.client-base-url}/payment/fail    
    kakaopay-base-url: https://open-api.kakaopay.com

payment:
  url:
    wallet: ${FRONTEND_WALLET_URL:http://34.64.85.123/user/wallet}
    success: ${FRONTEND_SUCCESS_URL:http://34.64.85.123/user/payment-success.html}
    fail: ${FRONTEND_FAIL_URL:http://34.64.85.123/user/payment-fail.html}
    cancel: ${FRONTEND_CANCEL_URL:http://34.64.85.123/user/payment-cancel.html}