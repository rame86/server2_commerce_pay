# payment src/main/resources/application-prod.yml
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${GCP_SERVER_1}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  data:
    redis:
      host: ${GCP_SERVER_1}
      port: ${REDIS_PORT}

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.example.payment.dto

kakao:
  pay:
    secret-key: ${KAKAO_PAY_SECRET_KEY} 
    cid: TC0ONETIME
    
    # 운영 서버 베이스 URL (게이트웨이 주소 포함)
    client-base-url: ${APP_CLIENT_BASE_URL:http://34.64.85.123/msa/pay}
    
    # dev 환경과 동일한 경로 구조로 수정
    approval-url: ${kakao.pay.client-base-url}/payment/charge/kakaopay/success
    cancel-url: ${kakao.pay.client-base-url}/payment/charge/kakaopay/cancel
    fail-url: ${kakao.pay.client-base-url}/payment/charge/kakaopay/fail    
    
    # Java의 kakaoPayBaseUrl 필드와 매핑되도록 하이픈(-) 추가
    kakao-pay-base-url: https://open-api.kakaopay.com

payment:
  url:
    wallet: ${FRONTEND_WALLET_URL:http://34.64.85.123/wallet}
    success: ${FRONTEND_SUCCESS_URL:http://34.64.85.123/payment-success.html}
    fail: ${FRONTEND_FAIL_URL:http://34.64.85.123/payment-fail.html}
    cancel: ${FRONTEND_CANCEL_URL:http://34.64.85.123/payment-cancel.html}